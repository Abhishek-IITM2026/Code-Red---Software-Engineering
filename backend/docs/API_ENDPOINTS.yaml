openapi: 3.1.0
info:
  title: Code-Red CIOP Platform Backend API
  description: Comprehensive REST API documentation for the Coaching Institute Operations Platform (CIOP)
  version: 1.0.0
  contact:
    name: Development Team
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Local Development Server
  - url: https://api.ciop.example.com
    description: Production Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/login

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid request parameters"

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [student, faculty, parent, admin, administration, director, superadmin]
        status:
          type: string
          enum: [active, inactive, suspended, on-leave]
        profilePicture:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    AISettings:
      type: object
      properties:
        provider:
          type: string
          enum: [grounded-rag, ollama, openai-compatible-cloud, openai-compatible-local, gemini]
        mode:
          type: string
          enum: [local, api-key]
        model:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        maxTokens:
          type: integer
          minimum: 1
        generationRateLimit:
          type: string
          example: "15 per minute"

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticate user with email and password, returns JWT token
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
              example:
                email: user@example.com
                password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        description: JWT Bearer token
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      summary: User Registration
      description: Register a new user account (student, faculty, parent, or admin)
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [student, faculty, parent, admin]
                  default: student
                title:
                  type: string
                  nullable: true
                  example: "Dr."
              example:
                email: newuser@example.com
                password: SecurePass123!
                firstName: John
                lastName: Doe
                role: student
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '400':
          description: Validation error or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Logout current user (invalidate token)
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully"

  /api/v1/auth/me:
    get:
      summary: Get Current User Profile
      description: Retrieve authenticated user's profile information
      tags:
        - Authentication
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/auth/refresh:
    post:
      summary: Refresh Authentication Token
      description: Obtain a new JWT token using existing token
      tags:
        - Authentication
      responses:
        '200':
          description: New token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string

  /api/v1/auth/otp/send:
    post:
      summary: Send OTP for Verification
      description: Send One-Time Password to user's email for verification purposes
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                  enum: [profile_update, password_change, profile_picture_update, email_change, password_reset, account_verification]
              example:
                email: user@example.com
                purpose: password_reset
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OTP sent to your email"

  /api/v1/auth/otp/verify:
    post:
      summary: Verify OTP Code
      description: Verify OTP code sent to user's email
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose, otp]
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
              example:
                email: user@example.com
                purpose: password_reset
                otp: "123456"
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/auth/profile/update:
    post:
      summary: Update User Profile
      description: Update user profile information (name, phone, etc.)
      tags:
        - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
              example:
                firstName: John
                lastName: Smith
                phone: "+1234567890"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/auth/profile/picture:
    post:
      summary: Update Profile Picture
      description: Upload and set a new profile picture for user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profilePicture:
                  type: string
                  description: Base64 encoded image or image URL
              example:
                profilePicture: "data:image/jpeg;base64,/9j/4AAQSkZJRg..."
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/auth/profile/change-password:
    post:
      summary: Change Password
      description: Change user's password with current password verification
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                confirmPassword:
                  type: string
                  minLength: 8
              example:
                currentPassword: oldpass123
                newPassword: newpass456
                confirmPassword: newpass456
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/auth/password/reset-request:
    post:
      summary: Request Password Reset
      description: Request password reset by email
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
              example:
                email: user@example.com
      responses:
        '200':
          description: Password reset OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/auth/password/reset-confirm:
    post:
      summary: Confirm Password Reset
      description: Complete password reset using OTP code
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
              example:
                email: user@example.com
                otp: "123456"
                newPassword: newpass456
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/auth/email/change-request:
    post:
      summary: Request Email Change
      description: Request to change user's email address
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail]
              properties:
                newEmail:
                  type: string
                  format: email
              example:
                newEmail: newemail@example.com
      responses:
        '200':
          description: Email change OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/auth/email/change-confirm:
    post:
      summary: Confirm Email Change
      description: Confirm email change using OTP
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  minLength: 6
              example:
                otp: "123456"
      responses:
        '200':
          description: Email changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/administration/dashboard:
    get:
      summary: Get Admin Dashboard Data
      description: Retrieve dashboard statistics and overview data for administrators
      tags:
        - Administration
      responses:
        '200':
          description: Dashboard data retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalStudents:
                        type: integer
                      totalStaff:
                        type: integer
                      totalCourses:
                        type: integer
                      activeCourses:
                        type: integer

  /api/v1/administration/ai-settings:
    get:
      summary: Get AI Settings Configuration
      description: Retrieve current AI system settings including model, provider, and rate limits
      tags:
        - Administration
        - AI Settings
      responses:
        '200':
          description: AI settings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AISettings'

    put:
      summary: Update AI Settings Configuration
      description: Update AI system settings including LLM provider, model selection, temperature, and rate limits
      tags:
        - Administration
        - AI Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [grounded-rag, ollama, openai-compatible-cloud, openai-compatible-local, gemini]
                mode:
                  type: string
                  enum: [local, api-key]
                model:
                  type: string
                  example: "llama3.2"
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  example: 0.2
                maxTokens:
                  type: integer
                  example: 1200
                generationRateLimit:
                  type: string
                  example: "15 per minute"
                apiKey:
                  type: string
                  nullable: true
                  description: API key for cloud providers
                baseUrl:
                  type: string
                  nullable: true
                  description: Base URL for OpenAI-compatible endpoints
                clearApiKey:
                  type: boolean
                  description: Set to true to clear existing API key
                assessmentSystemPrompt:
                  type: string
                  nullable: true
                studentChatSystemPrompt:
                  type: string
                  nullable: true
              example:
                provider: "ollama"
                mode: "local"
                model: "llama3.2"
                temperature: 0.2
                maxTokens: 1200
                generationRateLimit: "15 per minute"
      responses:
        '200':
          description: AI settings updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AISettings'

  /api/v1/administration/students:
    get:
      summary: List All Students
      description: Retrieve list of all students with pagination support
      tags:
        - Administration
        - Students
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended, pending-approval]
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer

    post:
      summary: Create New Student
      description: Register a new student in the system
      tags:
        - Administration
        - Students
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                password:
                  type: string
                  minLength: 8
                phone:
                  type: string
                  nullable: true
              example:
                email: student@example.com
                firstName: Alice
                lastName: Johnson
                password: SecurePass123!
      responses:
        '201':
          description: Student created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/administration/students/{student_id}:
    get:
      summary: Get Student Details
      description: Retrieve detailed information for a specific student
      tags:
        - Administration
        - Students
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Student details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'

    put:
      summary: Update Student Information
      description: Update student's profile information
      tags:
        - Administration
        - Students
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
              example:
                firstName: Alice
                lastName: Smith
      responses:
        '200':
          description: Student updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

    delete:
      summary: Delete Student
      description: Remove a student from the system
      tags:
        - Administration
        - Students
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Student deleted successfully

  /api/v1/administration/students/{student_id}/approve:
    post:
      summary: Approve Student Account
      description: Approve a pending student account for activation
      tags:
        - Administration
        - Students
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Student approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/administration/students/pending-approvals:
    get:
      summary: Get Pending Student Approvals
      description: List all students pending approval
      tags:
        - Administration
        - Students
      responses:
        '200':
          description: Pending students list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

  /api/v1/administration/students/{student_id}/status:
    patch:
      summary: Update Student Status
      description: Change student account status (active, inactive, suspended)
      tags:
        - Administration
        - Students
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended, on-leave]
              example:
                status: active
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/administration/staff:
    get:
      summary: List All Staff
      description: Retrieve list of all staff members (faculty, admin, etc.)
      tags:
        - Administration
        - Staff
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    post:
      summary: Create New Staff Member
      description: Add a new staff member (faculty, admin, etc.)
      tags:
        - Administration
        - Staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, role]
              properties:
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [faculty, admin, administration, director, superadmin]
                password:
                  type: string
                  minLength: 8
              example:
                email: faculty@example.com
                firstName: Bob
                lastName: Smith
                role: faculty
                password: SecurePass123!
      responses:
        '201':
          description: Staff member created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'

  /api/v1/administration/courses:
    get:
      summary: List All Courses
      description: Retrieve list of all courses in the system
      tags:
        - Administration
        - Courses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object

    post:
      summary: Create New Course
      description: Create a new course in the system
      tags:
        - Administration
        - Courses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                duration:
                  type: string
                  nullable: true
              example:
                name: "Advanced Mathematics"
                description: "Year 10 Mathematics Course"
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/administration/promotions/rules:
    get:
      summary: Get Student Promotion Rules
      description: Retrieve student promotion/advancement rules
      tags:
        - Administration
        - Promotions
      responses:
        '200':
          description: Promotion rules retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object

    post:
      summary: Set Student Promotion Rules
      description: Configure rules for student promotion/advancement
      tags:
        - Administration
        - Promotions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minimumPercentage:
                  type: number
                  example: 40
                requirementType:
                  type: string
                  enum: [percentage, grade]
              example:
                minimumPercentage: 40
                requirementType: percentage
      responses:
        '200':
          description: Rules updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/v1/assessments/ai/settings:
    get:
      summary: Get Assessment AI Settings
      description: Retrieve AI settings specific to assessment generation
      tags:
        - Assessments
        - AI
      responses:
        '200':
          description: Assessment AI settings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AISettings'

  /api/v1/assessments/ai/generate-questions:
    post:
      summary: Generate Assessment Questions Using AI
      description: Generate exam/assessment questions using AI based on topic and difficulty
      tags:
        - Assessments
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, difficulty, count]
              properties:
                topic:
                  type: string
                  example: "Quadratic Equations"
                difficulty:
                  type: string
                  enum: [easy, medium, hard]
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                subject:
                  type: string

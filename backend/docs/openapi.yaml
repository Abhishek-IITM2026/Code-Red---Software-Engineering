openapi: 3.1.0
info:
  title: Code Red Backend API
  version: 1.3.0
  description: >
    Production-style backend contract for the Code Red coaching institute platform.
    Canonical routes are versioned under `/api/v1`. This revision aligns the contract
    with the current frontend implementation, including authority-based navigation,
    inventory requests, payroll views, promotion flows, and faculty material publishing.
    Access control follows the frontend role families: student, faculty, parent,
    and administration (`admin`, `administration`, `director`, `superadmin`). Request
    payloads are validated with Pydantic, some background work is dispatched through
    Celery using Redis, and throttled endpoints may return HTTP 429.
servers:
  - url: http://localhost:3500
    description: Local Flask API server
  - url: http://localhost:3000
    description: Frontend dev server proxy, if configured
tags:
  - name: Auth
  - name: Students
  - name: Academics
  - name: Attendance
  - name: Marks
  - name: Schedule
  - name: Faculty
  - name: Assessments
  - name: Assignments
  - name: Notifications
  - name: Jobs
  - name: Parent
  - name: AI
  - name: Administration
  - name: Inventory
  - name: Payroll
  - name: Authority
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user
      description: Public login endpoint for all supported platform roles. The input fields appear under Request body, not Parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      description: Creates a user and assigns an initial role from the role table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out current client session
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh auth token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refreshed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/otp/send:
    post:
      tags: [Auth]
      summary: Send OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: OTP created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagResponse'
  /api/v1/auth/profile/update:
    post:
      tags: [Auth]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
  /api/v1/auth/profile/picture:
    post:
      tags: [Auth]
      summary: Update current user profile picture
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePictureUpdateRequest'
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
  /api/v1/auth/profile/change-password:
    post:
      tags: [Auth]
      summary: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlagResponse'

  /api/v1/students:
    get:
      tags: [Students]
      summary: List students
      description: Accessible to faculty and administration.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: class
          schema: { type: string }
        - in: query
          name: section
          schema: { type: string }
      responses:
        '200':
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/students/{studentId}:
    get:
      tags: [Students]
      summary: Get student by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentIdPath'
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v1/students/me:
    get:
      tags: [Students]
      summary: Get current student profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
  /api/v1/students/me/subjects:
    get:
      tags: [Students]
      summary: Get current student subjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subject list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
  /api/v1/students/me/subjects/{subjectId}/content:
    get:
      tags: [Students]
      summary: Get current student subject content tree
      description: >
        Returns the week-grouped subject content used by the student subject details page,
        including weekly contents, study materials, and assessments.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectIdPath'
      responses:
        '200':
          description: Subject content tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSubjectContent'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v1/students/me/performance:
    get:
      tags: [Students]
      summary: Get current student performance summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSummary'

  /api/v1/classes:
    get:
      tags: [Academics]
      summary: List classes
      description: Requires a bearer token entered through the Authorize button. This endpoint does not accept query or path parameters.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Class list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassInfo'
  /api/v1/classes/{classId}/sections:
    get:
      tags: [Academics]
      summary: List sections for a class
      description: Requires a bearer token entered through the Authorize button. The only input is the `classId` path parameter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClassIdPath'
      responses:
        '200':
          description: Section list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionInfo'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/attendance:
    get:
      tags: [Attendance]
      summary: List attendance records
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: studentId
          schema: { type: integer }
        - in: query
          name: subjectId
          schema: { type: integer }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: class
          schema: { type: integer }
        - in: query
          name: section
          schema: { type: string }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
    post:
      tags: [Attendance]
      summary: Create attendance sheet
      description: Accessible to faculty and administration.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceSubmission'
      responses:
        '201':
          description: Attendance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountSuccessResponse'
    put:
      tags: [Attendance]
      summary: Update attendance sheet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceSubmission'
      responses:
        '200':
          description: Attendance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountSuccessResponse'
  /api/v1/attendance/me/stats:
    get:
      tags: [Attendance]
      summary: Get current student attendance stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attendance statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStats'

  /api/v1/marks:
    get:
      tags: [Marks]
      summary: List marks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: studentId
          schema: { type: integer }
        - in: query
          name: subjectId
          schema: { type: integer }
        - in: query
          name: examType
          schema: { type: string }
      responses:
        '200':
          description: Marks records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarksRecord'

  /api/v1/schedule:
    get:
      tags: [Schedule]
      summary: List schedules
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: classId
          schema: { type: integer }
        - in: query
          name: sectionId
          schema: { type: string }
        - in: query
          name: facultyId
          schema: { type: integer }
      responses:
        '200':
          description: Schedule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
    post:
      tags: [Schedule]
      summary: Create schedule entry
      description: Administration access only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleWrite'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
  /api/v1/schedule/{scheduleId}:
    put:
      tags: [Schedule]
      summary: Update schedule entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleWrite'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    delete:
      tags: [Schedule]
      summary: Delete schedule entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduleIdPath'
      responses:
        '204':
          description: Schedule deleted
  /api/v1/schedule/me:
    get:
      tags: [Schedule]
      summary: Get current student timetable
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current student schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'

  /api/v1/faculty:
    get:
      tags: [Faculty]
      summary: List faculty
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faculty'
  /api/v1/faculty/classes:
    get:
      tags: [Faculty]
      summary: List faculty classes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Faculty class list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyClass'
  /api/v1/faculty/classes/{classId}/subjects:
    get:
      tags: [Faculty]
      summary: List subjects for a faculty-visible class
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClassIdPath'
      responses:
        '200':
          description: Subject list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
  /api/v1/faculty/subjects/{subjectId}/materials:
    get:
      tags: [Faculty]
      summary: List materials for a subject
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectIdPath'
      responses:
        '200':
          description: Materials list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags: [Faculty]
      summary: Publish study material for a subject
      description: >
        Creates a new study material record for the selected subject. Materials may be
        grouped week-wise or chapter-wise and should become visible in the student subject page.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreateRequest'
      responses:
        '201':
          description: Material published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/inventory/items:
    get:
      tags: [Inventory]
      summary: List inventory items
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
    post:
      tags: [Inventory]
      summary: Create inventory item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemWrite'
      responses:
        '201':
          description: Inventory item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
  /api/v1/inventory/items/{itemId}:
    put:
      tags: [Inventory]
      summary: Update inventory item
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryItemPatch'
      responses:
        '200':
          description: Inventory item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
    delete:
      tags: [Inventory]
      summary: Delete inventory item
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      responses:
        '204':
          description: Inventory item deleted
  /api/v1/inventory/requests:
    get:
      tags: [Inventory]
      summary: List material requests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: facultyId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, fulfilled] }
      responses:
        '200':
          description: Material requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialRequest'
    post:
      tags: [Inventory]
      summary: Create material request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequestCreate'
      responses:
        '201':
          description: Material request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRequest'
  /api/v1/inventory/requests/{requestId}/status:
    patch:
      tags: [Inventory]
      summary: Update material request status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequestStatusUpdate'
      responses:
        '200':
          description: Material request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRequest'

  /api/v1/authority/assignments:
    get:
      tags: [Authority]
      summary: List staff authority assignments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authority assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorityAssignment'
    put:
      tags: [Authority]
      summary: Replace authority assignments
      description: Director-level endpoint for updating role and authority access per employee.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AuthorityAssignmentWrite'
      responses:
        '200':
          description: Assignments saved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorityAssignment'
  /api/v1/authority/templates:
    get:
      tags: [Authority]
      summary: List role authority templates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role-based authority templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleAuthorityTemplate'

  /api/v1/administration/staff:
    get:
      tags: [Administration]
      summary: List staff register
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
  /api/v1/administration/promotions/candidates:
    get:
      tags: [Administration]
      summary: List student promotion candidates
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: targetClass
          schema: { type: string }
      responses:
        '200':
          description: Promotion candidate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionCandidate'
  /api/v1/administration/promotions/{studentId}:
    post:
      tags: [Administration]
      summary: Promote a student
      description: Confirms and records promotion for an eligible student.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionActionRequest'
      responses:
        '200':
          description: Student promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionActionResponse'
        '409':
          $ref: '#/components/responses/Error409'

  /api/v1/payroll/salary-slips:
    get:
      tags: [Payroll]
      summary: List staff salary slips
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: staffId
          schema: { type: string }
        - in: query
          name: year
          schema: { type: string }
        - in: query
          name: monthKey
          schema: { type: string }
      responses:
        '200':
          description: Salary slips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalarySlip'
  /api/v1/payroll/me/salary-slips:
    get:
      tags: [Payroll]
      summary: List current employee salary slips
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          schema: { type: string }
      responses:
        '200':
          description: Current employee salary slips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalarySlip'

  /api/v1/ai/generate-questions:
    post:
      tags: [AI]
      summary: Generate assessment questions
      description: Rate limited endpoint intended for faculty and administration users.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuestionsRequest'
      responses:
        '200':
          description: Generated questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
  /api/v1/ai/modify-questions:
    post:
      tags: [AI]
      summary: Modify generated questions
      description: Rate limited endpoint intended for faculty and administration users.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyQuestionsRequest'
      responses:
        '200':
          description: Modified questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'

  /api/v1/assessments:
    get:
      tags: [Assessments]
      summary: List assessments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: classId
          schema: { type: integer }
        - in: query
          name: subjectId
          schema: { type: integer }
        - in: query
          name: published
          schema: { type: boolean }
      responses:
        '200':
          description: Assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assessment'
    post:
      tags: [Assessments]
      summary: Create assessment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentWrite'
      responses:
        '201':
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
  /api/v1/assessments/{assessmentId}:
    get:
      tags: [Assessments]
      summary: Get assessment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentIdPath'
      responses:
        '200':
          description: Assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
    patch:
      tags: [Assessments]
      summary: Update assessment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentPatch'
      responses:
        '200':
          description: Assessment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
    delete:
      tags: [Assessments]
      summary: Delete assessment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentIdPath'
      responses:
        '204':
          description: Assessment deleted
  /api/v1/assessments/{assessmentId}/publish:
    post:
      tags: [Assessments]
      summary: Publish assessment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssessmentIdPath'
      responses:
        '200':
          description: Assessment published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'

  /api/v1/assignments:
    get:
      tags: [Assignments]
      summary: List assignments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: subjectId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
  /api/v1/assignments/{assignmentId}/submit:
    post:
      tags: [Assignments]
      summary: Submit assignment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentSubmissionRequest'
      responses:
        '201':
          description: Assignment submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentSubmissionResponse'

  /api/v1/notifications/schedule:
    post:
      tags: [Notifications]
      summary: Queue schedule notification batch
      description: >
        Administration access only. The batch record is stored immediately and the
        delivery work is dispatched to Celery for asynchronous execution.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleNotificationRequest'
      responses:
        '202':
          description: Notification batch queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedJobResponse'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/jobs/{taskId}:
    get:
      tags: [Jobs]
      summary: Get background job status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/parent/children:
    get:
      tags: [Parent]
      summary: List children linked to authenticated parent
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Linked children
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
  /api/v1/parent/children/{childId}:
    get:
      tags: [Parent]
      summary: Get linked child profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildIdPath'
      responses:
        '200':
          description: Child profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
  /api/v1/parent/children/{childId}/dashboard:
    get:
      tags: [Parent]
      summary: Get child dashboard summary for parent portal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildIdPath'
      responses:
        '200':
          description: Parent dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDashboard'
  /api/v1/parent/children/{childId}/attendance:
    get:
      tags: [Parent]
      summary: Get attendance summary for linked child
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildIdPath'
      responses:
        '200':
          description: Attendance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStats'
  /api/v1/parent/children/{childId}/performance:
    get:
      tags: [Parent]
      summary: Get performance summary for linked child
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildIdPath'
      responses:
        '200':
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSummary'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    StudentIdPath:
      in: path
      name: studentId
      required: true
      schema: { type: string }
    ChildIdPath:
      in: path
      name: childId
      required: true
      schema: { type: string }
    ClassIdPath:
      in: path
      name: classId
      required: true
      schema: { type: string }
    SubjectIdPath:
      in: path
      name: subjectId
      required: true
      schema: { type: string }
    ScheduleIdPath:
      in: path
      name: scheduleId
      required: true
      schema: { type: string }
    AssessmentIdPath:
      in: path
      name: assessmentId
      required: true
      schema: { type: string }
    AssignmentIdPath:
      in: path
      name: assignmentId
      required: true
      schema: { type: string }
    ItemIdPath:
      in: path
      name: itemId
      required: true
      schema: { type: string }
    RequestIdPath:
      in: path
      name: requestId
      required: true
      schema: { type: string }
    TaskIdPath:
      in: path
      name: taskId
      required: true
      schema: { type: string }
  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error422:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error429:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }
        employeeCode: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
        roleScope: { type: string }
        title: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        profilePicture: { type: string, nullable: true }
    Student:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            class: { type: string, nullable: true }
            section: { type: string, nullable: true }
            rollNumber: { type: string, nullable: true }
            enrollmentNo: { type: string, nullable: true }
            classId: { type: string, nullable: true }
    Faculty:
      type: object
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        subjects:
          type: array
          items: { type: string }
    FacultyClass:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        section: { type: string, nullable: true }
    Subject:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        teacherId: { type: string, nullable: true }
        facultyId: { type: string, nullable: true }
        credits: { type: integer, nullable: true }
    ClassInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: integer }
        section: { type: string, nullable: true }
    SectionInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    AttendanceRecord:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        subjectId: { type: string }
        date: { type: string, format: date }
        status: { type: string }
        markedBy: { type: string }
    AttendanceStats:
      type: object
      properties:
        total: { type: integer }
        present: { type: integer }
        absent: { type: integer }
        percentage: { type: number }
    MarksRecord:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        subjectId: { type: string }
        subject: { type: string, nullable: true }
        examType: { type: string }
        marks: { type: number }
        totalMarks: { type: number }
        date: { type: string, format: date }
    Schedule:
      type: object
      properties:
        id: { type: string }
        classId: { type: string }
        className: { type: string }
        sectionId: { type: string }
        sectionName: { type: string }
        dayOfWeek: { type: integer }
        timeSlot:
          $ref: '#/components/schemas/TimeSlot'
        subject: { type: string }
        subjectId: { type: string }
        facultyId: { type: string }
        facultyName: { type: string }
        roomNumber: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startTime: { type: string }
        endTime: { type: string }
        roomNo: { type: string, nullable: true }
    TimeSlot:
      type: object
      properties:
        id: { type: string }
        startTime: { type: string }
        endTime: { type: string }
    Material:
      type: object
      properties:
        id: { type: string }
        subjectId: { type: string, nullable: true }
        subjectName: { type: string, nullable: true }
        chapterId: { type: string, nullable: true }
        chapterTitle: { type: string, nullable: true }
        title: { type: string }
        unit: { type: string, nullable: true }
        week: { type: string, nullable: true }
        type: { type: string }
        description: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        uploadedBy: { type: string, nullable: true }
        isFacultyUpload: { type: boolean, nullable: true }
    SubjectWeekContent:
      type: object
      properties:
        id: { type: string }
        weekLabel: { type: string }
        contents:
          type: array
          items:
            type: object
            additionalProperties: true
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    StudentSubjectContent:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/SubjectWeekContent'
    StaffMember:
      type: object
      properties:
        id: { type: string }
        employeeCode: { type: string }
        name: { type: string }
        category: { type: string }
        role: { type: string }
        department: { type: string }
        joiningDate: { type: string, format: date }
        phone: { type: string, nullable: true }
        status: { type: string }
    AuthorityAssignment:
      type: object
      properties:
        staffId: { type: string }
        roles:
          type: array
          items: { type: string }
        roleTemplate: { type: string }
        authorities:
          $ref: '#/components/schemas/AuthorityFlags'
        updatedAt: { type: string }
        updatedBy: { type: string }
    AuthorityAssignmentWrite:
      type: object
      required: [staffId, roles, authorities]
      properties:
        staffId: { type: string }
        roles:
          type: array
          items: { type: string }
        roleTemplate: { type: string, nullable: true }
        authorities:
          $ref: '#/components/schemas/AuthorityFlags'
    AuthorityFlags:
      type: object
      properties:
        leaveApproval: { type: boolean }
        admissionApproval: { type: boolean }
        staffCreation: { type: boolean }
        studentPromotion: { type: boolean }
    RoleAuthorityTemplate:
      type: object
      properties:
        roleName: { type: string }
        authorities:
          type: array
          items: { type: string }
    InventoryItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        quantity: { type: integer }
        available: { type: integer }
        reserved: { type: integer }
        unit: { type: string }
        minStock: { type: integer }
        price: { type: number }
        supplier: { type: string, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InventoryItemWrite:
      type: object
      required: [name, category, quantity, unit, minStock, price]
      properties:
        name: { type: string }
        category: { type: string }
        quantity: { type: integer }
        available: { type: integer, nullable: true }
        reserved: { type: integer, nullable: true }
        unit: { type: string }
        minStock: { type: integer }
        price: { type: number }
        supplier: { type: string, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
    InventoryItemPatch:
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        quantity: { type: integer }
        available: { type: integer }
        reserved: { type: integer }
        unit: { type: string }
        minStock: { type: integer }
        price: { type: number }
        supplier: { type: string, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
    RequestItem:
      type: object
      properties:
        itemId: { type: string }
        itemName: { type: string }
        quantity: { type: integer }
    MaterialRequest:
      type: object
      properties:
        id: { type: string }
        facultyId: { type: string }
        facultyName: { type: string }
        department: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
        status: { type: string, enum: [pending, approved, rejected, fulfilled] }
        reviewNotes: { type: string, nullable: true }
        reviewedBy: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MaterialRequestCreate:
      type: object
      required: [facultyId, facultyName, department, items]
      properties:
        facultyId: { type: string }
        facultyName: { type: string }
        department: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
    MaterialRequestStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected, fulfilled] }
        reviewNotes: { type: string, nullable: true }
    PromotionCandidate:
      type: object
      properties:
        id: { type: string }
        admissionNo: { type: string }
        name: { type: string }
        className: { type: string }
        section: { type: string }
        targetClass: { type: string }
        guardian: { type: string }
        attendance: { type: string }
        average: { type: string }
        resultStatus: { type: string, enum: [Eligible, Review Required] }
        notes: { type: string, nullable: true }
        promoted: { type: boolean, nullable: true }
    PromotionActionRequest:
      type: object
      properties:
        targetClass: { type: string }
        confirmed: { type: boolean, default: true }
        note: { type: string, nullable: true }
    PromotionActionResponse:
      type: object
      properties:
        success: { type: boolean }
        studentId: { type: string }
        promotedTo: { type: string }
        promotedAt: { type: string, format: date-time }
    SalarySlip:
      type: object
      properties:
        id: { type: string }
        staffId: { type: string }
        staffName: { type: string }
        employeeCode: { type: string }
        category: { type: string }
        role: { type: string }
        department: { type: string }
        year: { type: string }
        monthKey: { type: string }
        monthLabel: { type: string }
        grossSalary: { type: number }
        netSalary: { type: number }
        unpaidLeaveDays: { type: number }
        paidLeaveDays: { type: number }
        overtimeHours: { type: number }
        generatedAt: { type: string, format: date-time, nullable: true }
    Question:
      type: object
      properties:
        id: { type: string }
        questionText: { type: string }
        questionType: { type: string }
        options:
          type: array
          items: { type: string }
          nullable: true
        correctAnswer:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          nullable: true
        marks: { type: integer }
        difficulty: { type: string }
    Assessment:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        classId: { type: string }
        subjectId: { type: string }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        totalMarks: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        dueDate: { type: string, nullable: true }
        published: { type: boolean }
        questionsDocumentId: { type: string, nullable: true }
    Assignment:
      type: object
      properties:
        id: { type: string }
        subjectId: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        dueDate: { type: string }
        totalMarks: { type: integer }
        status: { type: string }
    PerformanceSummary:
      type: object
      properties:
        average: { type: number }
        rank: { type: integer }
        totalStudents: { type: integer }
    ParentDashboard:
      type: object
      properties:
        child:
          $ref: '#/components/schemas/Student'
        attendance:
          $ref: '#/components/schemas/AttendanceStats'
        performance:
          $ref: '#/components/schemas/PerformanceSummary'
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, role]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [student, faculty, teacher, parent, admin, administration, director, superadmin, super admin]
        employeeCode: { type: string, nullable: true }
        title: { type: string, nullable: true }
    OtpSendRequest:
      type: object
      required: [email, purpose]
      properties:
        email: { type: string, format: email }
        purpose: { type: string }
    OtpVerifyRequest:
      type: object
      required: [email, purpose, otp]
      properties:
        email: { type: string, format: email }
        purpose: { type: string }
        otp: { type: string }
    OtpSendResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        expiresAt: { type: string, format: date-time }
        otp: { type: string }
    ProfileUpdateRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, nullable: true }
    ProfilePictureUpdateRequest:
      type: object
      required: [profilePicture]
      properties:
        profilePicture: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
        confirmPassword: { type: string }
    ProfileUpdateResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        user:
          $ref: '#/components/schemas/User'
    MessageResponse:
      type: object
      properties:
        message: { type: string }
        success: { type: boolean, nullable: true }
    SuccessFlagResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
    CountSuccessResponse:
      type: object
      properties:
        success: { type: boolean }
        count: { type: integer }
    SuccessIdResponse:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string }
    QueuedJobResponse:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string }
        taskId: { type: string }
    JobStatusResponse:
      type: object
      properties:
        taskId: { type: string }
        status: { type: string }
        ready: { type: boolean }
        result:
          type: object
          nullable: true
          additionalProperties: true
    AttendanceSubmission:
      type: object
      required: [date, class, records]
      properties:
        date: { type: string, format: date }
        class: { type: string }
        section: { type: string, nullable: true }
        records:
          type: array
          items:
            type: object
            required: [studentId, status]
            properties:
              studentId: { type: string }
              subjectId: { type: string, nullable: true }
              status: { type: string }
    ScheduleWrite:
      type: object
      required: [classId, facultyId, dayOfWeek]
      properties:
        classId: { type: string }
        facultyId: { type: string }
        subjectId: { type: string, nullable: true }
        dayOfWeek: { type: integer }
        roomNumber: { type: string, nullable: true }
        timeSlot:
          $ref: '#/components/schemas/TimeSlotWrite'
        startTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
    TimeSlotWrite:
      type: object
      properties:
        startTime: { type: string }
        endTime: { type: string }
    GenerateQuestionsRequest:
      type: object
      required: [subjectId, questionCount, totalMarks]
      properties:
        subjectId: { type: string }
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        questionCount: { type: integer }
        totalMarks: { type: integer }
        difficultyLevel: { type: string }
        questionTypes:
          type: object
          additionalProperties: { type: integer }
        customPrompt: { type: string, nullable: true }
    ModifyQuestionsRequest:
      type: object
      required: [questions, modificationPrompt]
      properties:
        questions:

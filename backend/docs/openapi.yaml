openapi: 3.0.3
info:
  title: Coaching Institute operation Management API
  description: Comprehensive API for managing coaching institute operations including students,
    faculty, attendance, marks, payroll, and more.
  version: 1.0.0
  
servers:
- url: /api/v1
  description: API v1
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get current user
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: User logout
      responses:
        '200':
          description: Logout successful
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh access token
      responses:
        '200':
          description: New access token
  /students:
    get:
      tags:
      - Students
      summary: List all students
      parameters:
      - in: query
        name: class
        schema:
          type: string
        description: Filter by class name
      - in: query
        name: section
        schema:
          type: string
        description: Filter by section
      responses:
        '200':
          description: List of students
  /students/me:
    get:
      tags:
      - Students
      summary: Get current student profile
      responses:
        '200':
          description: Student profile
  /students/me/subjects:
    get:
      tags:
      - Students
      summary: Get enrolled subjects for current student
      responses:
        '200':
          description: List of enrolled subjects
  /students/me/performance:
    get:
      tags:
      - Students
      summary: Get performance summary
      responses:
        '200':
          description: Performance summary
  /students/me/upcoming-courses:
    get:
      tags:
      - Students
      summary: Get upcoming courses
      responses:
        '200':
          description: List of upcoming courses
  /students/me/course-enrollments:
    get:
      tags:
      - Students
      summary: List course enrollments
      responses:
        '200':
          description: List of enrollments
    post:
      tags:
      - Students
      summary: Enroll in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: integer
                paymentPlan:
                  type: string
                installmentCount:
                  type: integer
      responses:
        '201':
          description: Enrollment created
  /students/me/course-enrollments/{enrollmentId}/payments:
    post:
      tags:
      - Students
      summary: Make payment for enrollment
      parameters:
      - in: path
        name: enrollmentId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                paymentMethod:
                  type: string
                referenceNumber:
                  type: string
      responses:
        '201':
          description: Payment recorded
  /students/me/subjects/{subjectId}/content:
    get:
      tags:
      - Students
      summary: Get subject content
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Subject content
  /students/me/subjects/{subjectId}/chat:
    post:
      tags:
      - Students
      summary: Chat about a subject
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                week:
                  type: string
                materialIds:
                  type: array
                  items:
                    type: string
                history:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Chat response
  /students/me/subjects/{subjectId}/chat/history:
    get:
      tags:
      - Students
      summary: Get chat history
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Chat history
    delete:
      tags:
      - Students
      summary: Delete chat history
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Deleted
  /students/{studentId}:
    get:
      tags:
      - Students
      summary: Get student by ID
      parameters:
      - in: path
        name: studentId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Student details
  /attendance:
    get:
      tags:
      - Attendance
      summary: Get attendance records
      parameters:
      - in: query
        name: studentId
        schema:
          type: integer
      - in: query
        name: subjectId
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: class
        schema:
          type: integer
      - in: query
        name: startDate
        schema:
          type: string
          format: date
      - in: query
        name: endDate
        schema:
          type: string
          format: date
      - in: query
        name: section
        schema:
          type: string
      responses:
        '200':
          description: Attendance records
    post:
      tags:
      - Attendance
      summary: Create attendance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attendanceDate:
                  type: string
                  format: date
                classId:
                  type: integer
                records:
                  type: array
      responses:
        '201':
          description: Created
    put:
      tags:
      - Attendance
      summary: Update attendance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attendanceDate:
                  type: string
                  format: date
                classId:
                  type: integer
                records:
                  type: array
      responses:
        '200':
          description: Updated
  /attendance/me/stats:
    get:
      tags:
      - Attendance
      summary: Get attendance statistics
      responses:
        '200':
          description: Attendance stats
  /marks:
    get:
      tags:
      - Marks
      summary: List marks records
      parameters:
      - in: query
        name: studentId
        schema:
          type: integer
      - in: query
        name: subjectId
        schema:
          type: integer
      - in: query
        name: examType
        schema:
          type: string
      responses:
        '200':
          description: Marks records
  /faculty:
    get:
      tags:
      - Faculty
      summary: List all faculty
      responses:
        '200':
          description: Faculty list
  /faculty/classes:
    get:
      tags:
      - Faculty
      summary: Get faculty assigned classes
      responses:
        '200':
          description: Classes list
  /faculty/classes/overview:
    get:
      tags:
      - Faculty
      summary: Get classes overview with subjects
      responses:
        '200':
          description: Classes overview
  /faculty/classes/{classId}/subjects:
    get:
      tags:
      - Faculty
      summary: Get subjects for a class
      parameters:
      - in: path
        name: classId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Subjects list
  /faculty/upcoming-courses:
    get:
      tags:
      - Faculty
      summary: Get upcoming courses
      responses:
        '200':
          description: Upcoming courses
  /faculty/subjects/{subjectId}/materials:
    get:
      tags:
      - Faculty
      summary: Get subject materials
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Materials list
    post:
      tags:
      - Faculty
      summary: Publish subject material
      parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                unit:
                  type: string
                week:
                  type: string
                className:
                  type: string
                section:
                  type: string
                materialType:
                  type: string
                sourceText:
                  type: string
                externalUrl:
                  type: string
                imageUrls:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Material created
  /faculty/performance/students:
    get:
      tags:
      - Faculty
      summary: Get student performance for faculty
      parameters:
      - in: query
        name: classId
        schema:
          type: integer
      responses:
        '200':
          description: Student performance
  /leave:
    get:
      tags:
      - Leave
      summary: List leave requests
      parameters:
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: applicantRole
        schema:
          type: string
      responses:
        '200':
          description: Leave requests
    post:
      tags:
      - Leave
      summary: Create leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaveType:
                  type: string
                fromDate:
                  type: string
                toDate:
                  type: string
                reason:
                  type: string
                contactNumber:
                  type: string
                supportingNote:
                  type: string
      responses:
        '201':
          description: Leave created
  /leave/{requestId}:
    get:
      tags:
      - Leave
      summary: Get leave request
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Leave request
  /leave/{requestId}/review:
    put:
      tags:
      - Leave
      summary: Review leave request
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - Approved
                  - Rejected
                reviewerComment:
                  type: string
      responses:
        '200':
          description: Reviewed
  /leave/{requestId}/cancel:
    put:
      tags:
      - Leave
      summary: Cancel leave request
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Cancelled
  /leave/stats:
    get:
      tags:
      - Leave
      summary: Get leave statistics
      responses:
        '200':
          description: Leave statistics
  /payroll/salary-slips:
    get:
      tags:
      - Payroll
      summary: List salary slips
      parameters:
      - in: query
        name: staffId
        schema:
          type: string
      - in: query
        name: year
        schema:
          type: integer
      - in: query
        name: monthKey
        schema:
          type: string
      responses:
        '200':
          description: Salary slips
  /payroll/salary-slips/{slipId}:
    get:
      tags:
      - Payroll
      summary: Get salary slip
      parameters:
      - in: path
        name: slipId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Salary slip
  /payroll/salary-slips/{slipId}/download:
    get:
      tags:
      - Payroll
      summary: Download salary slip PDF
      parameters:
      - in: path
        name: slipId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: PDF file
          content:
            application/pdf: {}
  /payroll/me/salary-slips:
    get:
      tags:
      - Payroll
      summary: Get my salary slips
      parameters:
      - in: query
        name: year
        schema:
          type: integer
      responses:
        '200':
          description: My salary slips
  /payroll/me/salary-slips/{slipId}/download:
    get:
      tags:
      - Payroll
      summary: Download my salary slip
      parameters:
      - in: path
        name: slipId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: PDF file
  /payroll/me/account-details:
    get:
      tags:
      - Payroll
      summary: Get my salary account
      responses:
        '200':
          description: Account details
    put:
      tags:
      - Payroll
      summary: Update salary account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountHolderName:
                  type: string
                bankName:
                  type: string
                accountNumber:
                  type: string
                ifscCode:
                  type: string
                branchName:
                  type: string
                accountType:
                  type: string
                upiId:
                  type: string
      responses:
        '200':
          description: Updated
  /payroll/me/account-change-requests:
    get:
      tags:
      - Payroll
      summary: List account change requests
      responses:
        '200':
          description: Requests list
    post:
      tags:
      - Payroll
      summary: Create account change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestedData:
                  type: object
                proofDocumentUrl:
                  type: string
                proofDocumentName:
                  type: string
                proofNotes:
                  type: string
      responses:
        '201':
          description: Created
  /inventory/items:
    get:
      tags:
      - Inventory
      summary: List inventory items
      responses:
        '200':
          description: Items list
    post:
      tags:
      - Inventory
      summary: Create inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                quantity:
                  type: integer
                available:
                  type: integer
                reserved:
                  type: integer
                unit:
                  type: string
                minStock:
                  type: integer
                price:
                  type: number
                supplier:
                  type: string
                location:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Created
  /inventory/items/{itemId}:
    put:
      tags:
      - Inventory
      summary: Update inventory item
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Inventory
      summary: Delete inventory item
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
  /inventory/requests:
    get:
      tags:
      - Inventory
      summary: List material requests
      parameters:
      - in: query
        name: facultyId
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          description: Requests list
    post:
      tags:
      - Inventory
      summary: Create material request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                facultyId:
                  type: integer
                department:
                  type: string
                items:
                  type: array
      responses:
        '201':
          description: Created
  /inventory/requests/{requestId}/status:
    patch:
      tags:
      - Inventory
      summary: Update material request status
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                reviewNotes:
                  type: string
      responses:
        '200':
          description: Updated
  /inventory/vendors:
    get:
      tags:
      - Inventory
      summary: List vendors
      responses:
        '200':
          description: Vendors list
    post:
      tags:
      - Inventory
      summary: Create vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contactPerson:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                gstNumber:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Created
  /inventory/procurements:
    get:
      tags:
      - Inventory
      summary: List procurements
      responses:
        '200':
          description: Procurements list
    post:
      tags:
      - Inventory
      summary: Create procurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryItemId:
                  type: integer
                vendorId:
                  type: integer
                quantity:
                  type: integer
                unitPrice:
                  type: number
                taxAmount:
                  type: number
                shippingCost:
                  type: number
                invoiceNumber:
                  type: string
                purchaseDate:
                  type: string
                paymentStatus:
                  type: string
                receivedStatus:
                  type: string
      responses:
        '201':
          description: Created
  /notifications/schedule:
    post:
      tags:
      - Notifications
      summary: Schedule notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                recipientScope:
                  type: string
      responses:
        '202':
          description: Scheduled
  /notifications/email/status:
    get:
      tags:
      - Notifications
      summary: Get email transport status
      responses:
        '200':
          description: Status
  /notifications/email/send:
    post:
      tags:
      - Notifications
      summary: Send email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: array
                  items:
                    type: string
                cc:
                  type: array
                  items:
                    type: string
                bcc:
                  type: array
                  items:
                    type: string
                subject:
                  type: string
                text:
                  type: string
                html:
                  type: string
                category:
                  type: string
      responses:
        '201':
          description: Sent
  /notifications/email/sync:
    post:
      tags:
      - Notifications
      summary: Sync email messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                mailbox:
                  type: string
                unseenOnly:
                  type: boolean
      responses:
        '202':
          description: Syncing
  /notifications/email/messages:
    get:
      tags:
      - Notifications
      summary: List email messages
      parameters:
      - in: query
        name: direction
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          description: Messages
  /notifications/email/messages/{messageId}:
    get:
      tags:
      - Notifications
      summary: Get email message
      parameters:
      - in: path
        name: messageId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Message
  /parent/children:
    get:
      tags:
      - Parent
      summary: List children
      responses:
        '200':
          description: Children list
  /parent/children/{childId}:
    get:
      tags:
      - Parent
      summary: Get child details
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Child details
  /parent/children/{childId}/dashboard:
    get:
      tags:
      - Parent
      summary: Get child dashboard
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Dashboard data
  /parent/children/{childId}/attendance:
    get:
      tags:
      - Parent
      summary: Get child attendance
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Attendance
  /parent/children/{childId}/performance:
    get:
      tags:
      - Parent
      summary: Get child performance
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Performance
  /parent/children/{childId}/fees:
    get:
      tags:
      - Parent
      summary: Get child fees
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Fees
  /parent/children/{childId}/faculty:
    get:
      tags:
      - Parent
      summary: Get faculty contacts
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Faculty contacts
  /parent/children/{childId}/courses:
    get:
      tags:
      - Parent
      summary: Get child courses
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Courses
  /parent/children/{childId}/course-enrollments:
    get:
      tags:
      - Parent
      summary: Get course enrollments
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Enrollments
  /parent/children/{childId}/course-enrollments/{enrollmentId}/payments:
    post:
      tags:
      - Parent
      summary: Make course payment
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      - in: path
        name: enrollmentId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                paymentMethod:
                  type: string
                referenceNumber:
                  type: string
      responses:
        '201':
          description: Payment
  /parent/children/{childId}/invoices:
    get:
      tags:
      - Parent
      summary: Get invoices
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Invoices
  /parent/children/{childId}/schedule:
    get:
      tags:
      - Parent
      summary: Get child schedule
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Schedule
  /schedule:
    get:
      tags:
      - Schedule
      summary: List schedules
      parameters:
      - in: query
        name: classId
        schema:
          type: integer
      - in: query
        name: facultyId
        schema:
          type: integer
      - in: query
        name: sectionId
        schema:
          type: string
      - in: query
        name: dayOfWeek
        schema:
          type: integer
      responses:
        '200':
          description: Schedules
    post:
